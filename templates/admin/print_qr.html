<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Print QR | {{ perfume.box_serial_number }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
</head>
<body class="print-sticker">
  <div class="sticker">
    <img class="sticker-logo" src="{{ url_for('static', filename='img/aseel-logo.jpg') }}" alt="ASEEL">
    <img class="sticker-qr" src="{{ url_for('static', filename='qr/' + qr_file) }}" alt="QR code">
    <p><strong>{{ perfume.perfume_name }}</strong></p>
    <p>{{ perfume.brand_name }}</p>
    <p>{{ perfume.box_serial_number }}</p>
    <p class="tiny">{{ perfume.unique_code }}</p>
    <p class="tiny">Scan to verify authenticity</p>
  </div>
  <div class="no-print hero-actions">
    <button class="btn btn-gold" onclick="window.print()">Print</button>
    <a class="btn btn-ghost" href="{{ url_for('admin.product_detail', perfume_id=perfume.id) }}">Back</a>
  </div>
</body>
</html>
