services:
  - type: web
    name: aseel
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 4
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@aseel.ae
      - key: ADMIN_PASSWORD
        value: AseelAdmin2026!
      - key: BASE_URL
        sync: false
      - key: FLASK_DEBUG
        value: "0"
